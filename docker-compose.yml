services:
  postgres:
    image: postgres:16-alpine
    container_name: sat-sa-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satsa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satsa_password}
      POSTGRES_DB: ${POSTGRES_DB:-satsa_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satsa_user} -d ${POSTGRES_DB:-satsa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: sat-sa-postgres-data
